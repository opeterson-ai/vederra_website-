image: node:20

pipelines:
  branches:
    main:
      - step:
          name: Deploy to Cloudflare Pages
          caches:
            - node
          script:
            - test -n "$CLOUDFLARE_API_TOKEN"
            - rm -rf dist
            - mkdir dist
            - find . -mindepth 1 -maxdepth 1 ! -name .git ! -name dist ! -name bitbucket-pipelines.yml ! -name .gitignore -exec cp -R {} dist/ \;
            - npx wrangler@latest pages deploy dist --project-name=vederra-website --branch=main
